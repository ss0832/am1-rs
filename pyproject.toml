[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "am1-rs-python"
version = "0.1.3"
description = "AM1 semiempirical method (am1-rs) with a Python-native API and an ASE calculator"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
authors = [{ name = "ss0832" }]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
ase = ["ase>=3.22"]

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "am1_rs._native"
