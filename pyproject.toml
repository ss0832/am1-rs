[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "am1-rs-python"
# Single source of truth: maturin reads the version from Cargo.toml. Keeping a literal here
# as well is how three copies of the version got out of step.
dynamic = ["version"]
description = "AM1-family semiempirical methods (AM1, RM1) with a Python-native API and an ASE calculator: energies, analytic gradients, CPHF Hessians, AM1-BCC charges, and periodic boundary conditions with k-points, analytic stress and phonons"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ss0832" }]
dependencies = ["numpy>=1.21"]

# PEP 639. The SPDX expression is the licence of this project; `license-files` lists the notice
# files that must travel with every distribution, wheels included. That is not decoration:
# clause 2 of the BSD-3-Clause covering the bundled PySEQM-derived parameters requires the
# copyright notice to accompany binary redistributions, and a wheel is a binary redistribution.
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    # The linked Rust crates, generated by `tools/collect_dependency_licenses.py`. 112 of them end
    # up statically inside `_native.pyd`, which makes the wheel a copy of each: MIT requires its
    # copyright and permission notice to accompany a copy, Apache-2.0 §4(a) requires its licence
    # text. Bundled *data* is what THIRD_PARTY_NOTICES.md covers; this is the linked *code*, and
    # it is the larger set by two orders of magnitude.
    "THIRD_PARTY_LICENSES.md",
    "third_party/*/LICENSE",
    # The per-directory provenance notes travel with the wheel too, since 0.2.3. A licence on its
    # own says what the terms are, not *which* files they cover or where those came from, and
    # Apache-2.0 4(b)-(c) -- statement of changes, retained attribution -- are satisfied by these
    # READMEs rather than by the licence text. Attribution that reaches only readers of the sdist
    # is attribution most users never see. `license-files` puts them under `dist-info/licenses/`,
    # so this does not put anything in the root of site-packages.
    "third_party/*/README.md",
]

keywords = [
    "chemistry",
    "computational-chemistry",
    "quantum-chemistry",
    "semiempirical",
    "am1",
    "rm1",
    "nddo",
    "ase",
    "molecular-dynamics",
    "periodic-boundary-conditions",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.optional-dependencies]
ase = ["ase>=3.22"]

# `pip install am1-rs-python` puts the CLI on PATH.
#
# The Rust crate builds its own `am1_rs_cli` binary, but a wheel cannot ship that alongside the
# extension module, so `am1_rs.__main__` mirrors it over the same native bindings — same modes,
# same flags, same output. `python -m am1_rs` works too, for environments where the scripts
# directory is not on PATH.
[project.scripts]
am1-rs = "am1_rs.__main__:main"

[project.urls]
Homepage = "https://github.com/ss0832/am1-rs"
Repository = "https://github.com/ss0832/am1-rs"
Issues = "https://github.com/ss0832/am1-rs/issues"
Changelog = "https://github.com/ss0832/am1-rs/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ss0832/am1-rs/tree/main/docs"

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "am1_rs._native"
# The notice files are carried by `license-files` above, which puts them under
# `dist-info/licenses/` where they belong. Listing them in `include` as well would additionally
# drop them into the root of site-packages, which pollutes every environment that installs this.
include = [
    # `*.DEF` and `*.DAT` are antechamber's verbatim data files, both `include_str!`-ed into the
    # library, so the sdist must carry them or the build fails. They live under `third_party/`
    # rather than `src/data/` so that each sits beside the licence covering it.
    { path = "third_party/**/*.DEF", format = "sdist" },
    { path = "third_party/**/*.DAT", format = "sdist" },
    # Also in the sdist, where a reader browses the tree rather than `dist-info/`. The wheel gets
    # them through `license-files` above; CI requires one per `third_party/` subdirectory in both.
    { path = "third_party/**/*.md", format = "sdist" },
    { path = "docs/**/*.md", format = "sdist" },
    { path = "tests/**/*.py", format = "sdist" },
    # The generators. `THIRD_PARTY_LICENSES.md` names the script that produces it and the RM1 CSV
    # names the one that extracted it; a reader holding only the sdist should be able to rerun
    # both rather than take the output on trust.
    { path = "tools/**/*.py", format = "sdist" },
]
